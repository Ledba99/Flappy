<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Flappy Plane ✈️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #70c5ce;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      width: 100%;
      max-width: 400px;
      height: 600px;
      background: #fff;
      margin: 20px auto;
      position: relative;
      border: 3px solid #000;
      overflow: hidden;
      touch-action: manipulation;
    }

    #bird {
      width: 40px;
      height: 40px;
      font-size: 30px;
      text-align: center;
      line-height: 40px;
      position: absolute;
      top: 100px;
      left: 50px;
    }

    .pipe {
      width: 60px;
      background: gray;
      position: absolute;
      bottom: 0;
    }

    .pipe.top {
      top: 0;
      bottom: auto;
      transform: rotate(180deg);
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    #gameOver {
      position: absolute;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-size: 32px;
      display: none;
      color: red;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="bird">✈️</div>
    <div id="score">Score: 0</div>
    <div id="gameOver">Game Over<br><small>Zum Neustarten Seite neu laden</small></div>
  </div>

  <script>
    const game = document.getElementById("game");
    const bird = document.getElementById("bird");
    const scoreDisplay = document.getElementById("score");
    const gameOverText = document.getElementById("gameOver");

    let birdTop = 100;
    let gravity = 2;
    let isGameOver = false;
    let score = 0;

    // Steuerung für PC
    document.addEventListener("keydown", () => {
      if (!isGameOver) birdTop -= 40;
    });

    // Steuerung für Handy (Touch)
    document.addEventListener("touchstart", () => {
      if (!isGameOver) birdTop -= 40;
    });

    function createPipe() {
      if (isGameOver) return;

      const pipeGap = 150;
      const pipeTopHeight = Math.floor(Math.random() * 250) + 50;
      const pipeBottomHeight = 600 - pipeTopHeight - pipeGap;

      const topPipe = document.createElement("div");
      topPipe.classList.add("pipe", "top");
      topPipe.style.height = pipeTopHeight + "px";
      topPipe.style.left = "100%";

      const bottomPipe = document.createElement("div");
      bottomPipe.classList.add("pipe");
      bottomPipe.style.height = pipeBottomHeight + "px";
      bottomPipe.style.left = "100%";

      game.appendChild(topPipe);
      game.appendChild(bottomPipe);

      let pipeX = game.clientWidth;
      const pipeMove = setInterval(() => {
        if (isGameOver) {
          clearInterval(pipeMove);
          return;
        }

        pipeX -= 2;
        topPipe.style.left = pipeX + "px";
        bottomPipe.style.left = pipeX + "px";

        const birdLeft = 50;
        const birdRight = birdLeft + 40;

        const collisionZone = pipeX < birdRight && pipeX + 60 > birdLeft;

        if (
          collisionZone &&
          (birdTop < pipeTopHeight || birdTop + 40 > pipeTopHeight + pipeGap)
        ) {
          endGame();
        }

        if (pipeX === birdLeft) {
          score++;
          scoreDisplay.textContent = "Score: " + score;
        }

        if (pipeX < -60) {
          clearInterval(pipeMove);
          game.removeChild(topPipe);
          game.removeChild(bottomPipe);
        }
      }, 20);
    }

    function endGame() {
      isGameOver = true;
      gameOverText.style.display = "block";
    }

    function gameLoop() {
      if (isGameOver) return;

      birdTop += gravity;
      bird.style.top = birdTop + "px";

      if (birdTop > 560 || birdTop < 0) {
        endGame();
      }
    }

    setInterval(gameLoop, 20);
    setInterval(createPipe, 2000);
  </script>
</body>
</html>
